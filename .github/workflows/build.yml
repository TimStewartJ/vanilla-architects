name: Build modpack

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      mightyarchitect_ref:
        description: Optional TMA commit/branch to test instead of the released jar; never publishes a pack
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: pack-${{ github.ref }}-${{ inputs.mightyarchitect_ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Verify and package (${{ matrix.shader }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shader: [i-like-vanilla, complementary-reimagined, bliss-shader]
    env:
      GRADLE_USER_HOME: ${{ github.workspace }}/build/gradle-home
      VANILLA_ARCHITECTS_INSTANCE: ${{ github.workspace }}/build/instance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.x'
          cache: false
      - name: Install pinned packwiz
        run: go install github.com/packwiz/packwiz@170b22d785959dda5876b54b7f16e1b807a57fb6
      - name: Test validation failures
        run: python -m unittest discover -s tests -v
      - name: Build and verify every download
        run: python scripts/build_pack.py --download --install-dir build/instance
      - name: Build and verify the dedicated-server manifest
        if: matrix.shader == 'i-like-vanilla'
        run: python scripts/build_server.py --install-dir build/server
      - name: Check out the existing production-client harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: TimStewartJ/TheMightyArchitectury
          ref: ${{ inputs.mightyarchitect_ref || 'ad4cc2849bbb04ab8bfe11b2936f4f404c8be5e4' }}
          path: build/harness
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '25'
      - name: Prepare the released-jar smoke test
        run: |
          python scripts/prepare_smoke.py build/harness --shader '${{ matrix.shader }}'
          chmod +x build/harness/gradlew
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1 libgl1-mesa-dri libegl1 libegl-mesa0 mesa-utils
      - name: Test and build an explicitly selected TMA candidate
        if: inputs.mightyarchitect_ref != ''
        working-directory: build/harness
        run: |
          ./gradlew :fabric:26.3:test --tests com.timmie.mightyarchitect.test.unit.SuperByteBufferNormalsTest \
            :fabric:26.3:jar --console=plain --no-daemon \
            -Porg.gradle.java.installations.fromEnv=JAVA_HOME_25_X64
      - name: Stage the candidate in the disposable test instance only
        if: inputs.mightyarchitect_ref != ''
        run: python scripts/stage_candidate.py build/harness
      - name: Dedicated-server pack loading smoke
        if: matrix.shader == 'i-like-vanilla'
        working-directory: build/harness
        run: pwsh -NoProfile -File scripts/run-server-test-matrix.ps1 -Versions 26.3 -Loaders fabric
      - name: Production world, builder and shader smoke
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          SDL_VIDEO_FORCE_EGL: '1'
          ALSOFT_DRIVERS: 'null'
        run: |
          cd build/harness
          xvfb-run -a -s "-screen 0 1280x720x24" \
            pwsh -NoProfile -File scripts/run-client-test-matrix.ps1 \
              -Mode prod -Versions 26.3 -Loaders fabric -Port 26743 \
              -ClientTimeoutSeconds 900 -ClientStallSeconds 180
      - name: Confirm the exact pack versions and active shader
        run: python scripts/verify_runtime.py build/harness
      - name: Upload runtime evidence
        # Failure-only and without client-test-runtime/ (vanilla server jar + world, ~100 MB per shader)
        # to keep artifacts small. The server log is already in the results.
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: runtime-evidence-${{ matrix.shader }}
          if-no-files-found: ignore
          retention-days: 3
          path: |
            build/harness/build/prod-client-test-results/
            build/harness/build/server-test-results/
            build/harness/fabric/versions/26.3/run-prod-client-test/hs_err_pid*.log
            build/harness/fabric/versions/26.3/run-prod-client-test/crash-reports/
            build/harness/fabric/versions/26.3/run-prod-client-test/config/DistantHorizons.toml
            build/harness/fabric/versions/26.3/run-prod-client-test/config/iris.properties
      - name: Ensure export did not change source locks
        run: git diff --exit-code
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: inputs.mightyarchitect_ref == '' && matrix.shader == 'i-like-vanilla'
        with:
          name: Vanilla-Architects
          path: dist/*
          if-no-files-found: error

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v') && inputs.mightyarchitect_ref == ''
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Download verified build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --name Vanilla-Architects --dir dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          test -f "dist/Vanilla-Architects-$version.mrpack"
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag --title "Vanilla Architects $version" \
            --notes "Minecraft 26.3 Fabric. 0.4.1 updates the Cattingham Poplar palette (spruce plank floors); mods are unchanged from 0.4.0. Import the .mrpack into Prism Launcher or the Modrinth App. Includes 34 mods, three selectable shader packs and four optional resource packs (Fresh Animations, its Details and Player extensions, and CoffeePBR); enable resource packs in Options -> Resource Packs. Updates The Mighty Architectury to 3.0.0: a server or LAN host running it no longer turns away players without it, and its theme tools are now vanilla items (old marker blocks become air). Adds Entity Model/Texture Features, 3D Skin Layers, Not Enough Animations, Sound Physics Remastered, ImmediatelyFast, EntityCulling, Double Doors and Freecam (F4), plus the Cattingham Poplar Mighty Architectury theme and palette. Dedicated servers need Tax Free Levels, Grind Enchantments, Double Doors, Collective, Fabric API and Cloth Config. Shaders are off on first launch. Allocate at least 4 GB RAM, preferably 6 GB. See README.md for details."
