allprojects {
    afterEvaluate { project ->
        if (project.path == ":fabric:26.3") {
            tasks.named("runProductionClientTest") { task ->
                def instance = new File(System.getenv("VANILLA_ARCHITECTS_INSTANCE"))
                // Replace Loom's default mod set: test the released pack jars, not a rebuilt mod.
                task.mods.setFrom(project.fileTree(new File(instance, "mods")) {
                    include "*.jar"
                })
                task.mods.from(project.tasks.named("clientTestJar"))
                task.jvmArgs.addAll("-Xms512m", "-Xmx4G")
                task.doFirst {
                    project.copy {
                        from new File(instance, "config")
                        into task.runDir.dir("config")
                    }
                    project.copy {
                        from new File(instance, "shaderpacks")
                        into task.runDir.dir("shaderpacks")
                    }
                    def iris = task.runDir.file("config/iris.properties").get().asFile
                    iris.text = iris.text.replace("enableShaders=false", "enableShaders=true")
                    // Only the fixture skips the first-join tour that otherwise replaces test screens.
                    def onboarding = task.runDir.file("config/buildprint/config.json").get().asFile
                    onboarding.parentFile.mkdirs()
                    onboarding.text = '{"onboardingComplete":true,"migrationPromptShown":true}'
                }
            }
        }
    }
}
